[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-matter-lensing-auditor"
version = "0.3.0"
description = "Uncertainty-aware FITS auditing of gravitational-lensing mass maps against luminous-matter proxies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Biswajit Jana" }]
keywords = ["astronomy", "dark matter", "gravitational lensing", "FITS", "Hubble"]
dependencies = [
  "astropy>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.10",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
hff = ["reproject>=0.14"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
lensaudit = "lensaudit.cli:main"

[project.urls]
Homepage = "https://github.com/Biswajit1999/dark-matter-lensing-auditor"
Issues = "https://github.com/Biswajit1999/dark-matter-lensing-auditor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
